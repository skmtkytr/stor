<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>stor</h1>
      <p>Enter your API key to connect.</p>
      <input type="text" id="key-input" placeholder="sk-..." autofocus spellcheck="false" autocomplete="off">
      <button id="key-submit">Connect</button>
      <p id="auth-error" class="error" hidden></p>
    </div>
  </div>

  <div id="app-screen" class="screen" hidden>
    <header>
      <h1>stor</h1>
      <div id="stats" class="stats"></div>
    </header>

    <div class="add-bar">
      <input type="text" id="add-input" placeholder="magnet:?xt=urn:btih:... or torrent URL">
      <button id="add-btn">Add</button>
      <label class="upload-btn">
        <input type="file" id="add-file" accept=".torrent" hidden>
        Upload .torrent
      </label>
    </div>

    <table id="torrent-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Size</th>
          <th>Progress</th>
          <th>Speed</th>
          <th>Peers</th>
          <th>State</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="torrent-list"></tbody>
    </table>

    <p id="empty-msg" class="empty" hidden>No torrents. Add one above.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
