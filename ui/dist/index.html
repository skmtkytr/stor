<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen" class="screen active">
    <div class="auth-box">
      <h1>stor</h1>
      <p>Enter your API key to connect.</p>
      <input type="text" id="key-input" placeholder="sk-..." autofocus spellcheck="false" autocomplete="off">
      <button id="key-submit">Connect</button>
      <p id="auth-error" class="error" hidden></p>
    </div>
  </div>

  <div id="app-screen" class="screen">
    <header>
      <div class="header-left">
        <h1>stor</h1>
        <span id="stats-text" class="stats"></span>
        <span id="sel-count" class="sel-count"></span>
      </div>
      <div class="header-right">
        <label class="max-active-label">
          Max active:
          <input type="number" id="max-active-input" min="1" max="50" value="5">
        </label>
      </div>
    </header>

    <div class="add-bar">
      <input type="text" id="add-input" placeholder="magnet:?xt=urn:btih:... or torrent URL">
      <button id="add-btn">Add</button>
      <label class="upload-btn">
        <input type="file" id="add-file" accept=".torrent" multiple hidden>
        Upload .torrent
      </label>
    </div>

    <table id="torrent-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Size</th>
          <th>Progress</th>
          <th>Speed</th>
          <th>ETA</th>
          <th>Peers</th>
          <th>State</th>
          <th>Queue</th>
        </tr>
      </thead>
      <tbody id="torrent-list"></tbody>
    </table>

    <p id="empty-msg" class="empty" hidden>No torrents. Add one above.</p>
  </div>

  <!-- Context menu -->
  <div id="ctx-menu" class="ctx-menu">
    <button onclick="ctxAction('resume')">Resume</button>
    <button onclick="ctxAction('pause')">Pause</button>
    <div class="ctx-sep"></div>
    <button onclick="ctxAction('queue-top')">Move to Top</button>
    <button onclick="ctxAction('queue-bottom')">Move to Bottom</button>
    <div class="ctx-sep"></div>
    <button class="ctx-danger" onclick="ctxAction('remove')">Remove</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
