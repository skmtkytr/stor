<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 400px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #09090b; color: #e4e4e7; font-size: 12px; }

    /* Header */
    .header { padding: 8px 12px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 14px; font-weight: 700; color: #fafafa; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .conn { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
    .conn.ok { background: #052e16; color: #4ade80; }
    .conn.err { background: #450a0a; color: #f87171; }
    .settings-btn { color: #71717a; font-size: 11px; text-decoration: none; cursor: pointer; }
    .settings-btn:hover { color: #a1a1aa; }

    /* Stats bar */
    .stats { display: flex; gap: 2px; padding: 6px 12px; border-bottom: 1px solid #27272a; background: #18181b; }
    .stat { flex: 1; text-align: center; padding: 3px 0; border-radius: 3px; font-size: 10px; color: #a1a1aa; }
    .stat .n { font-weight: 600; color: #e4e4e7; display: block; font-size: 13px; }
    .stat.active { background: #172554; }
    .stat.active .n { color: #60a5fa; }

    /* Add row */
    .add-row { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #27272a; }
    .add-row input { flex: 1; padding: 5px 8px; background: #18181b; border: 1px solid #3f3f46; border-radius: 4px; color: #e4e4e7; font-size: 11px; outline: none; }
    .add-row input:focus { border-color: #52525b; }
    .add-row button { padding: 5px 12px; background: #fafafa; color: #09090b; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 500; }
    .add-row button:hover { background: #e4e4e7; }

    /* Controls: sort + filter */
    .controls { display: flex; gap: 6px; padding: 6px 12px; border-bottom: 1px solid #27272a; align-items: center; }
    .controls label { font-size: 10px; color: #71717a; }
    .controls select { background: #18181b; color: #a1a1aa; border: 1px solid #3f3f46; border-radius: 3px; font-size: 10px; padding: 2px 4px; outline: none; }

    /* Torrent list */
    .list { max-height: 350px; overflow-y: auto; }
    .item { padding: 8px 12px; border-bottom: 1px solid #1c1c1e; }
    .item:hover { background: #18181b; }
    .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item-name { font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .item-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .item-actions button { background: none; border: none; color: #71717a; cursor: pointer; font-size: 12px; padding: 1px 4px; border-radius: 2px; line-height: 1; }
    .item-actions button:hover { color: #e4e4e7; background: #27272a; }
    .item-actions button.danger:hover { color: #f87171; background: #450a0a; }

    .item-meta { font-size: 10px; color: #71717a; margin-top: 3px; display: flex; gap: 8px; }
    .item-meta .speed { color: #60a5fa; }

    /* Progress bar */
    .bar { height: 4px; background: #27272a; border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .bar .fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .bar .fill.downloading { background: #3b82f6; }
    .bar .fill.seeding { background: #10b981; }
    .bar .fill.complete { background: #22c55e; }
    .bar .fill.paused { background: #71717a; }
    .bar .fill.error { background: #ef4444; }
    .bar .fill.metadata, .bar .fill.adding { background: #eab308; }

    .empty { padding: 24px; text-align: center; color: #52525b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>stor</h1>
    <div class="header-right">
      <span id="conn" class="conn">...</span>
      <a class="settings-btn" href="options.html" target="_blank">Settings</a>
    </div>
  </div>

  <div class="stats">
    <div class="stat" id="stat-total"><span class="n">-</span>Total</div>
    <div class="stat" id="stat-dl"><span class="n">-</span>DL</div>
    <div class="stat" id="stat-seed"><span class="n">-</span>Seed</div>
    <div class="stat" id="stat-done"><span class="n">-</span>Done</div>
    <div class="stat" id="stat-paused"><span class="n">-</span>Paused</div>
    <div class="stat" id="stat-error"><span class="n">-</span>Error</div>
  </div>

  <div class="add-row">
    <input type="text" id="add-input" placeholder="magnet:?xt=urn:btih:... or URL">
    <button id="add-btn">Add</button>
  </div>

  <div class="controls">
    <label>Sort</label>
    <select id="sort-select">
      <option value="queue">#</option>
      <option value="name">Name</option>
      <option value="size">Size</option>
      <option value="progress">Progress</option>
      <option value="speed">Speed</option>
      <option value="eta">ETA</option>
    </select>
    <select id="sort-dir">
      <option value="asc">Asc</option>
      <option value="desc">Desc</option>
    </select>
    <label style="margin-left: 8px;">Filter</label>
    <select id="filter-select">
      <option value="all">All</option>
      <option value="downloading">Downloading</option>
      <option value="seeding">Seeding</option>
      <option value="complete">Complete</option>
      <option value="paused">Paused</option>
      <option value="error">Error</option>
    </select>
  </div>

  <div id="list" class="list">
    <div class="empty">Loading...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
