<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; font-size: 13px; }
    .header { padding: 10px 12px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 14px; color: #58a6ff; }
    .status { font-size: 11px; }
    .status.ok { color: #3fb950; }
    .status.err { color: #f85149; }
    .add-row { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #21262d; }
    .add-row input { flex: 1; padding: 4px 8px; background: #161b22; border: 1px solid #30363d; border-radius: 4px; color: #c9d1d9; font-size: 12px; }
    .add-row button { padding: 4px 10px; background: #238636; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .list { max-height: 300px; overflow-y: auto; }
    .item { padding: 8px 12px; border-bottom: 1px solid #21262d; }
    .item-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .bar { height: 4px; background: #21262d; border-radius: 2px; margin-top: 4px; }
    .bar .fill { height: 100%; background: #58a6ff; border-radius: 2px; }
    .bar .fill.done { background: #238636; }
    .empty { padding: 20px; text-align: center; color: #8b949e; }
    .settings-link { text-align: center; padding: 8px; border-top: 1px solid #21262d; }
    .settings-link a { color: #58a6ff; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>stor</h1>
    <span id="status" class="status">...</span>
  </div>

  <div class="add-row">
    <input type="text" id="add-input" placeholder="magnet:?...">
    <button id="add-btn">Add</button>
  </div>

  <div id="list" class="list">
    <div class="empty">Loading...</div>
  </div>

  <div class="settings-link">
    <a href="options.html" target="_blank">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
