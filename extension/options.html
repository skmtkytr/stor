<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>stor - Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #09090b; color: #e4e4e7; padding: 40px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 1.5rem; }
    h2 { font-size: 14px; font-weight: 600; color: #a1a1aa; margin: 1.5rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #27272a; }

    label { display: block; margin-bottom: 0.25rem; font-size: 13px; color: #a1a1aa; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 8px 12px; margin-bottom: 1rem;
      background: #18181b; border: 1px solid #3f3f46; border-radius: 6px;
      color: #e4e4e7; font-size: 13px; outline: none;
    }
    input:focus { border-color: #52525b; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }
    .checkbox-row input[type="checkbox"] { accent-color: #3b82f6; width: 16px; height: 16px; }
    .checkbox-row label { margin: 0; cursor: pointer; }
    .checkbox-row .desc { font-size: 11px; color: #71717a; margin-left: 24px; margin-top: -4px; margin-bottom: 8px; }

    .select-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0.75rem; }
    .select-row label { margin: 0; min-width: 120px; }
    select {
      background: #18181b; color: #a1a1aa; border: 1px solid #3f3f46;
      border-radius: 4px; font-size: 12px; padding: 4px 8px; outline: none;
    }

    button { padding: 8px 24px; background: #fafafa; color: #09090b; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; margin-top: 1rem; }
    button:hover { background: #e4e4e7; }
    .saved { color: #4ade80; margin-left: 12px; font-size: 13px; display: none; }

    .test-row { margin-top: 1rem; }
    .test-result { font-size: 12px; margin-top: 0.5rem; }
    .test-result.ok { color: #4ade80; }
    .test-result.err { color: #f87171; }
  </style>
</head>
<body>
  <h1>stor Settings</h1>

  <h2>Connection</h2>

  <label for="url">Daemon URL</label>
  <input type="text" id="url" placeholder="http://192.168.1.100:9090">

  <label for="key">API Key</label>
  <input type="password" id="key" placeholder="sk-...">

  <div class="test-row">
    <button type="button" id="test-btn" style="background: #27272a; color: #e4e4e7;">Test Connection</button>
    <span id="test-result" class="test-result"></span>
  </div>

  <h2>Link Handling</h2>

  <div class="checkbox-row">
    <input type="checkbox" id="handle-magnets" checked>
    <label for="handle-magnets">Intercept magnet links</label>
  </div>
  <div class="desc" style="font-size: 11px; color: #71717a; margin-left: 24px; margin-bottom: 12px;">
    Automatically send magnet: links to stor instead of opening them.
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="handle-torrents" checked>
    <label for="handle-torrents">Intercept .torrent links</label>
  </div>
  <div class="desc" style="font-size: 11px; color: #71717a; margin-left: 24px; margin-bottom: 12px;">
    Automatically send .torrent file downloads to stor.
  </div>

  <div class="checkbox-row">
    <input type="checkbox" id="context-menu" checked>
    <label for="context-menu">Show "Download with stor" in right-click menu</label>
  </div>

  <h2>Notifications</h2>

  <div class="select-row">
    <label for="badge-timeout">Badge display time</label>
    <select id="badge-timeout">
      <option value="1000">1 second</option>
      <option value="3000" selected>3 seconds</option>
      <option value="5000">5 seconds</option>
      <option value="10000">10 seconds</option>
    </select>
  </div>

  <br>
  <button id="save">Save</button>
  <span class="saved" id="saved">Saved!</span>

  <script src="options.js"></script>
</body>
</html>
